id = "moon.file-explorer"
name = "File Explorer"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Open Yazi (terminal file manager) in a herdr pane"
platforms = ["macos", "linux", "windows"]

# Unix build: install yazi via Homebrew
[[build]]
platforms = ["macos", "linux"]
command = ["bash", "-c", "command -v yazi >/dev/null 2>&1 || brew install yazi"]

# Windows build: check for yazi, error with install options if missing
[[build]]
platforms = ["windows"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/check-yazi.ps1"]

# Cross-platform pane - herdr spawns relative command (works on Unix AND Windows now)
[[panes]]
id = "explorer"
title = "Explorer"
platforms = ["macos", "linux", "windows"]
placement = "split"
command = ["yazi"]

# Unix startup (no-op for native approach)
[[startup]]
platforms = ["macos", "linux"]
command = ["bin/startup"]

# Windows startup - event-driven one-shot via event hooks
[[startup]]
platforms = ["windows"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/startup.ps1"]

# Cross-platform actions (macOS/Linux) - use native plugin pane open (v0.8.0+)
# Uses bash + python3 for JSON parsing; NOT for Windows (see Windows actions below)
[[actions]]
id = "open"
title = "Open file explorer"
description = "Open Yazi in a split pane"
platforms = ["macos", "linux"]
contexts = ["global", "workspace", "tab"]
command = ["bash", "-c", "DIR=\"$(bash \"$HERDR_PLUGIN_ROOT/bin/resolve-dir.sh\")\"; OUT=\"$(exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin moon.file-explorer --entrypoint explorer --placement split --cwd \"$DIR\")\"; PANE_ID=\"$(printf '%s' \"$OUT\" | python3 -c 'import sys, json; r=json.load(sys.stdin).get(\"result\",{}); pane=r.get(\"plugin_pane\",{}).get(\"pane\",{}); print(pane.get(\"pane_id\",\"\"), end=\"\")' 2>/dev/null || true)\"; [ -n \"$PANE_ID\" ] && \"${HERDR_BIN_PATH:-herdr}\" pane rename \"$PANE_ID\" \"yazi\" >/dev/null 2>&1 || true"]

[[actions]]
id = "open-tab"
title = "Open file explorer in new tab"
description = "Open Yazi in a new tab"
platforms = ["macos", "linux"]
contexts = ["global", "workspace", "tab"]
command = ["bash", "-c", "DIR=\"$(bash \"$HERDR_PLUGIN_ROOT/bin/resolve-dir.sh\")\"; OUT=\"$(exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin moon.file-explorer --entrypoint explorer --placement tab --cwd \"$DIR\")\"; TAB_ID=\"$(printf '%s' \"$OUT\" | python3 -c 'import sys, json; r=json.load(sys.stdin).get(\"result\",{}); pane=r.get(\"plugin_pane\",{}).get(\"pane\",{}); print(pane.get(\"tab_id\",\"\"), end=\"\")' 2>/dev/null || true)\"; [ -n \"$TAB_ID\" ] && \"${HERDR_BIN_PATH:-herdr}\" tab rename \"$TAB_ID\" \"yazi\" >/dev/null 2>&1 || true"]

# Windows-specific actions with version detection & fallback
# These use PowerShell and work on Windows natively (herdr v0.8.0+ native, fallback for older)
[[actions]]
id = "open-windows"
title = "Open file explorer"
description = "Open Yazi in a split pane (Windows)"
platforms = ["windows"]
contexts = ["global", "workspace", "tab"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-yazi-windows.ps1"]

[[actions]]
id = "open-tab-windows"
title = "Open file explorer in new tab"
description = "Open Yazi in a new tab (Windows)"
platforms = ["windows"]
contexts = ["global", "workspace", "tab"]
command = ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-yazi-tab-windows.ps1"]